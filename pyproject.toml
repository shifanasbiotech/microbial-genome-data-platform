[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbial-genome-data-platform"
version = "0.1.0"
description = "Reproducible ingestion, QC, storage and querying of microbial genome resources"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.84",
    "pandas>=2.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
